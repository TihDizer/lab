services:
  attacker:
    build: ./attacker
    container_name: attacker
    tty: true
    stdin_open: true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    networks:
      - lab-net
  victim:
    build: ./victim
    container_name: victim
    networks:
      - lab-net

  suricata:
    build: ./suricata
    container_name: suricata
    restart: unless-stopped
    network_mode: host
    security_opt:
      - label=disable
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules:/etc/suricata/rules:ro
      - ./suricata/logs:/var/log/suricata
    command:
      - suricata
      - -c
      - /etc/suricata/suricata.yaml
      - -q
      - "1"

networks:
  lab-net:
    driver: bridge
