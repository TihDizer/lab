services:
  attacker:
    build: ./attacker
    container_name: attacker
    tty: true
    stdin_open: true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    networks:
      - lab-net
  victim:
    build: ./victim
    container_name: victim
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge
